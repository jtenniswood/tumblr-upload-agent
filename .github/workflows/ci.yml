name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Resolve pinned dependencies (the missing check from NET-91)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax compile
        run: python -m compileall app
